<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자산관리 앱 이용 경험 조사</title>
<style>
  :root {
    --bg: #f7f7f8;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #2f6fed;
    --accent-text: #ffffff;
    --border: #e2e2e6;
    --danger: #d84343;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 20px 20px 40px;
    display: flex;
    flex-direction: column;
  }
  .topbar { display: flex; align-items: center; justify-content: space-between; min-height: 24px; margin-bottom: 8px; }
  .back-btn {
    background: none; border: none; padding: 4px 0; margin: 0;
    color: var(--muted); font-size: 14px; cursor: pointer; font-family: inherit;
  }
  .back-btn:disabled { visibility: hidden; }
  .progress { font-size: 13px; color: var(--muted); }
  .progress-bar { height: 4px; background: var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 20px; }
  .progress-bar-fill { height: 100%; background: var(--accent); transition: width 0.2s ease; }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 24px 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    flex: 1;
  }
  h1 { font-size: 19px; margin: 0 0 12px; }
  h2 { font-size: 17px; margin: 0 0 16px; line-height: 1.45; }
  p { color: var(--muted); font-size: 14px; }
  .intro-block p { margin: 6px 0; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }
  .option {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    cursor: pointer;
    font-size: 15px;
    transition: border-color 0.15s, background 0.15s;
  }
  .option.selected { border-color: var(--accent); background: #eef3ff; }
  .option.disabled { opacity: 0.4; cursor: not-allowed; }
  .option input { margin-top: 3px; flex-shrink: 0; }
  .scale-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .scale-btn {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 0;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    background: #fff;
  }
  .scale-btn.selected { border-color: var(--accent); background: var(--accent); color: var(--accent-text); }
  .scale-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  input[type=text], textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 16px;
    font-family: inherit;
    margin-top: 8px;
  }
  textarea { min-height: 110px; resize: vertical; }
  .error { color: var(--danger); font-size: 13px; margin: 10px 0 0; display: none; }
  .error.show { display: block; }
  .footer { margin-top: 20px; }
  button.primary {
    width: 100%;
    padding: 15px 0;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 0; margin-bottom: 12px; }
  .note { font-size: 13px; color: var(--muted); background: #f4f6fb; border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
  .center { text-align: center; }
  .emoji { font-size: 36px; margin-bottom: 12px; }
  a.link-btn {
    display: block; text-align: center; margin-top: 16px; padding: 15px 0;
    border-radius: 12px; background: #111; color: #fff; text-decoration: none; font-weight: 600;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <button class="back-btn" id="backBtn" disabled>← 이전</button>
    <div id="progressLabel" class="progress"></div>
  </div>
  <div class="progress-bar"><div id="progressFill" class="progress-bar-fill" style="width:0%"></div></div>
  <div id="card" class="card"></div>
</div>

function newUuid() {
  return (crypto.randomUUID
    ? crypto.randomUUID()
    : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
      }));
}

function render() {
  const step = steps[currentId];
  const card = document.getElementById("card");
  const backBtn = document.getElementById("backBtn");
  const isQuestion = QUESTION_TYPES.includes(step.type);

  // 제출이 끝난 뒤의 UT 단계에서는 뒤로가기를 막습니다(설문 재제출 방지).
  backBtn.disabled = !(isQuestion && !step.isExtra && history.length > 0);

  if (isQuestion && !step.isExtra) {
    const qNum = QUESTION_ORDER.indexOf(step.id) + 1;
    document.getElementById("progressLabel").textContent = qNum + " / " + QUESTION_ORDER.length;
    document.getElementById("progressFill").style.width = Math.round((qNum / QUESTION_ORDER.length) * 100) + "%";
  } else {
    document.getElementById("progressLabel").textContent = step.isExtra ? "설문 완료" : "";
    document.getElementById("progressFill").style.width = "100%";
  }

  if (step.type === "intro") {
    card.innerHTML = `
      <h1>자산관리 앱 이용 경험 조사</h1>
      <div class="intro-block">
        <p>이 설문은 계좌·카드·투자 자산의 '조회·관리' 경험을 개선하기 위한 학생 포트폴리오 조사입니다.</p>
        <p>· 소요 시간 약 3~4분</p>
        <p>· 설문 응답에는 이름·연락처 등 직접 식별 정보를 수집하지 않습니다</p>
        <p>· 설문이 끝난 뒤, 후속 테스트 참여를 원하시는 분만 따로 연락처를 남기실 수 있습니다. 이때 남기신 연락처는 <b>설문 응답과 분리해 별도로 저장</b>되며, 서로 연결되지 않습니다</p>
        <p>· 응답은 통계 및 주제 분석에 사용되며, 서술형 답변 일부는 개인을 식별할 수 없도록 익명 처리하여 포트폴리오에 인용될 수 있습니다</p>
        <p>· 서술형 응답에는 이름·계좌번호·구체적인 금융 금액 등 개인정보를 적지 말아주세요</p>
        <p>· 원본 응답은 분석 완료 후 30일 이내 삭제하며, 익명화된 집계 결과와 인용문은 포트폴리오에 계속 사용될 수 있습니다</p>
        <p>· 정답이 없는 조사입니다. 평소 느끼신 대로 답해주세요.</p>
      </div>
      <div class="footer"><button class="primary" id="nextBtn">설문 시작하기</button></div>`;
    document.getElementById("nextBtn").onclick = () => goTo("q1");
    return;
  }

  if (step.type === "terminate") {
    logScreenout(step.id);
    card.innerHTML = `<div class="center"><div class="emoji">🙏</div>
      <p style="color:var(--text); font-size:15px;">${step.text}</p></div>`;
    return;
  }

  if (step.type === "submitting") {
    card.innerHTML = `<div class="center"><p>제출 중입니다…</p></div>`;
    submitAnswers();
    return;
  }

  if (step.type === "complete") {
    card.innerHTML = `<div class="center"><div class="emoji">✅</div>
      <h2>설문에 응해주셔서 감사합니다!</h2>
      <p>보내주신 답변은 자산관리 앱 화면을 개선하는 데 소중히 쓰겠습니다.</p></div>`;
    return;
  }

  if (step.type === "ut_done") {
    card.innerHTML = `<div class="center"><div class="emoji">🙌</div>
      <h2>신청이 완료되었습니다!</h2>
      <p>설문과 테스트 신청 모두 감사합니다. 남겨주신 연락 수단으로 테스트 링크를 보내드릴게요.</p></div>`;
    return;
  }

  if (step.type === "ut_submitting") {
    card.innerHTML = `<div class="center"><p>신청 내용을 보내는 중입니다…</p></div>`;
    submitUtApplicant();
    return;
  }

  if (step.type === "ut_error") {
    card.innerHTML = `<div class="center">
      <p style="color:var(--danger)">신청 내용을 보내지 못했습니다. 설문 응답은 이미 정상 접수되었으니 걱정하지 않으셔도 됩니다.</p>
      <div class="footer"><button class="primary" id="retryUtBtn">다시 시도</button></div>
      <p class="hint" id="skipUt" style="cursor:pointer; text-decoration:underline;">신청 없이 마치기</p></div>`;
    document.getElementById("retryUtBtn").onclick = () => goTo("ut_submitting");
    document.getElementById("skipUt").onclick = () => goTo("complete");
    return;
  }

  if (step.type === "ut_form") {
    const u = state.ut;
    card.innerHTML = `
      <h2>테스트 참여 신청</h2>
      <p class="hint">아래 정보는 <b>설문 응답과 분리되어 저장</b>되며, 테스트 안내와 사례비 지급에만 사용됩니다.</p>

      <p style="color:var(--text); font-size:15px; margin:18px 0 0;">어떻게 불러드리면 될까요?</p>
      <input type="text" id="utName" maxlength="30" placeholder="이름 또는 닉네임" value="${(u.name || "").replace(/"/g, "&quot;")}">

      <p style="color:var(--text); font-size:15px; margin:20px 0 0;">연락 수단을 골라주세요.</p>
      <div class="options" id="utMethod" style="margin-top:10px;">
        ${[["카톡","카카오톡 ID"],["전화","전화번호"],["이메일","이메일"],["인스타","인스타그램 ID"]]
          .map(([v, l]) => `<label class="option${u.method === v ? " selected" : ""}" data-value="${v}">
            <input type="radio" name="utMethod" ${u.method === v ? "checked" : ""}><span>${l}</span></label>`).join("")}
      </div>
      <input type="text" id="utContact" maxlength="100" placeholder="연락받으실 곳을 적어주세요" value="${(u.contact || "").replace(/"/g, "&quot;")}">

      <p style="color:var(--text); font-size:15px; margin:20px 0 0;">핀크 앱의 자산 탭을 써보신 적이 있나요?</p>
      <div class="options" id="utFinnq" style="margin-top:10px;">
        ${[["주로사용","현재 주로 사용한다"],["가끔사용","현재 가끔 사용한다"],
           ["과거사용","과거에 썼지만 최근에는 사용하지 않는다"],["미사용","사용해본 적이 없다"]]
          .map(([v, l]) => `<label class="option${u.finnq === v ? " selected" : ""}" data-value="${v}">
            <input type="radio" name="utFinnq" ${u.finnq === v ? "checked" : ""}><span>${l}</span></label>`).join("")}
      </div>

      <div class="note" style="margin-top:22px;">
        <b>수집·이용 동의</b> (필수)<br><br>
        · 수집 항목: 이름 또는 닉네임, 연락 수단<br>
        · 이용 목적: 테스트 참여자 선정, 테스트 링크 발송, 사례비 지급<br>
        · 보유 기간: 사례비 지급 완료 후 30일 이내 파기<br>
        · 테스트 중에는 화면 클릭 경로와 소요 시간이 자동으로 기록되며, 이 기록은 분석 완료 후 30일 이내 파기합니다<br>
        · 익명 처리된 집계 결과(성공률·평균 소요시간 등)는 포트폴리오에 사용될 수 있습니다<br>
        · 동의를 거부하실 수 있으며, 이 경우 테스트 신청만 어려울 뿐 앞서 제출하신 설문 응답에는 아무 영향이 없습니다
      </div>
      <div class="options" id="utConsent">
        <label class="option${u.consent === "동의" ? " selected" : ""}" data-value="동의">
          <input type="radio" name="utConsent" ${u.consent === "동의" ? "checked" : ""}><span>위 내용에 동의합니다</span></label>
      </div>

      <p class="error" id="errMsg"></p>
      <div class="footer"><button class="primary" id="nextBtn">신청 보내기</button></div>
      <p class="hint" id="skipUtForm" style="text-align:center; cursor:pointer; text-decoration:underline; margin-top:14px;">신청하지 않고 마치기</p>`;
    attachUtFormHandlers();
    return;
  }

  if (step.type === "error") {
    card.innerHTML = `<div class="center">
      <p style="color:var(--danger)">제출 중 오류가 발생했습니다. 인터넷 연결을 확인하고 다시 시도해주세요.</p>
      <div class="footer"><button class="primary" id="retryBtn">다시 시도</button></div></div>`;
    document.getElementById("retryBtn").onclick = () => goTo("submitting");
    return;
  }

  /* --- 질문 화면 --- */
  let html = `<h2>${step.title}</h2>`;
  if (step.note) html += `<div class="note">${step.note}</div>`;
  if (step.hint) html += `<p class="hint">${step.hint}</p>`;

  if (step.type === "single" || step.type === "single_other") {
    html += `<div class="options" id="optList">`;
    step.options.forEach(o => {
      const sel = state.answers[step.id] === o.value;
      html += `<label class="option${sel ? " selected" : ""}" data-value="${o.value}">
        <input type="radio" name="${step.id}" ${sel ? "checked" : ""}><span>${o.label}</span></label>`;
    });
    html += `</div>`;
    if (step.type === "single_other") {
      const show = state.answers[step.id] === step.otherTrigger;
      const val = (state.answers[step.id + "_other"] || "").replace(/"/g, "&quot;");
      html += `<input type="text" id="otherInput" maxlength="100" placeholder="직접 입력해주세요"
        style="display:${show ? "block" : "none"}" value="${val}">`;
    }
  }

  if (step.type === "checkbox2") {
    const chosen = state.answers[step.id] || [];
    html += `<div class="options" id="optList">`;
    step.options.forEach(o => {
      const sel = chosen.includes(o.value);
      const dis = !sel && chosen.length >= 2;
      html += `<label class="option${sel ? " selected" : ""}${dis ? " disabled" : ""}" data-value="${o.value}">
        <input type="checkbox" ${sel ? "checked" : ""} ${dis ? "disabled" : ""}><span>${o.label}</span></label>`;
    });
    html += `</div>`;
  }

  if (step.type === "scale_na" || step.type === "scale_multi_na") {
    const cur = state.answers[step.id];
    html += `<div class="scale-row" id="scaleRow">`;
    for (let i = 1; i <= 5; i++) {
      html += `<div class="scale-btn${cur === i ? " selected" : ""}" data-value="${i}">${i}</div>`;
    }
    html += `</div><div class="scale-labels"><span>1 매우 어려웠다</span><span>매우 쉬웠다 5</span></div>
      <div class="options" id="naOpt">`;
    const naList = step.type === "scale_na"
      ? [opt("na", step.naLabel)]
      : step.naOptions;
    naList.forEach(o => {
      const sel = cur === o.value;
      html += `<label class="option${sel ? " selected" : ""}" data-value="${o.value}">
        <input type="radio" name="${step.id}_na" ${sel ? "checked" : ""}><span>${o.label}</span></label>`;
    });
    html += `</div>`;
  }

  if (step.type === "textarea") {
    const val = (state.answers[step.id] || "");
    html += `<textarea id="textInput" maxlength="500" placeholder="자유롭게 적어주세요 (선택)">${val}</textarea>`;
  }

  html += `<p class="error" id="errMsg"></p>
    <div class="footer"><button class="primary" id="nextBtn">${step.id === "q14" ? "제출하기" : "다음"}</button></div>`;

  card.innerHTML = html;
  attachHandlers(step);
}

function attachHandlers(step) {
  if (step.type === "single" || step.type === "single_other") {
    document.querySelectorAll("#optList .option").forEach(el => {
      el.onclick = (e) => {
        e.preventDefault();
        const prev = state.answers[step.id];
        state.answers[step.id] = el.dataset.value;
        // '기타'에서 다른 답으로 바꾸면 직접입력 값도 함께 정리
        if (step.type === "single_other" && prev === step.otherTrigger && el.dataset.value !== step.otherTrigger) {
          delete state.answers[step.id + "_other"];
        }
        render();
      };
    });
    const other = document.getElementById("otherInput");
    if (other) other.oninput = () => { state.answers[step.id + "_other"] = other.value; };
  }

  if (step.type === "checkbox2") {
    document.querySelectorAll("#optList .option").forEach(el => {
      el.onclick = (e) => {
        e.preventDefault();
        if (el.classList.contains("disabled")) return;
        const v = el.dataset.value;
        let chosen = state.answers[step.id] || [];
        chosen = chosen.includes(v) ? chosen.filter(x => x !== v)
               : (chosen.length < 2 ? chosen.concat([v]) : chosen);
        state.answers[step.id] = chosen;
        render();
      };
    });
  }

  if (step.type === "scale_na" || step.type === "scale_multi_na") {
    document.querySelectorAll("#scaleRow .scale-btn").forEach(el => {
      el.onclick = () => { state.answers[step.id] = parseInt(el.dataset.value, 10); render(); };
    });
    document.querySelectorAll("#naOpt .option").forEach(el => {
      el.onclick = (e) => { e.preventDefault(); state.answers[step.id] = el.dataset.value; render(); };
    });
  }

  if (step.type === "textarea") {
    const t = document.getElementById("textInput");
    t.oninput = () => { state.answers[step.id] = t.value; };
  }

  document.getElementById("nextBtn").onclick = () => handleNext(step);
}

function attachUtFormHandlers() {
  const u = state.ut;
  document.getElementById("utName").oninput = (e) => { u.name = e.target.value; };
  document.getElementById("utContact").oninput = (e) => { u.contact = e.target.value; };
  document.querySelectorAll("#utMethod .option").forEach(el => {
    el.onclick = (e) => { e.preventDefault(); u.method = el.dataset.value; render(); };
  });
  document.querySelectorAll("#utFinnq .option").forEach(el => {
    el.onclick = (e) => { e.preventDefault(); u.finnq = el.dataset.value; render(); };
  });
  document.querySelectorAll("#utConsent .option").forEach(el => {
    el.onclick = (e) => { e.preventDefault(); u.consent = (u.consent === "동의") ? null : "동의"; render(); };
  });
  document.getElementById("skipUtForm").onclick = () => goTo("complete");
  document.getElementById("nextBtn").onclick = () => {
    if (!(u.name || "").trim()) return showError("이름 또는 닉네임을 적어주세요.");
    if (!u.method) return showError("연락 수단을 골라주세요.");
    if (!(u.contact || "").trim()) return showError("연락받으실 곳을 적어주세요.");
    if (!u.finnq) return showError("핀크 자산 탭 사용 경험을 골라주세요.");
    if (u.consent !== "동의") return showError("수집·이용에 동의해주셔야 신청할 수 있습니다.");
    goTo("ut_submitting");
  };
}

function showError(msg) {
  const el = document.getElementById("errMsg");
  el.textContent = msg;
  el.classList.add("show");
}

function handleNext(step) {
  const val = state.answers[step.id];

  if (step.required) {
    if (step.type === "single" || step.type === "single_other") {
      if (!val) return showError("응답을 선택해주세요.");
      if (step.type === "single_other" && val === step.otherTrigger) {
        if (!(state.answers[step.id + "_other"] || "").trim()) return showError("직접 입력 내용을 작성해주세요.");
      }
    }
    if (step.type === "checkbox2" && (!val || val.length !== 2)) return showError("정확히 2개를 선택해주세요.");
    if ((step.type === "scale_na" || step.type === "scale_multi_na") && val === undefined) {
      return showError("응답을 선택해주세요.");
    }
  }

  goTo(step.next(val), true);
}

function goTo(id, pushHistory) {
  if (pushHistory && QUESTION_TYPES.includes(steps[currentId].type)) history.push(currentId);
  else if (id === "q1") history.length = 0;
  currentId = id;
  window.scrollTo(0, 0);
  render();
}

document.getElementById("backBtn").onclick = () => {
  if (!history.length) return;
  currentId = history.pop();
  window.scrollTo(0, 0);
  render();
};

/* ------------------------------------------------------------------ */
/* 저장                                                                */
/* ------------------------------------------------------------------ */
function supabaseHeaders() {
  // 주의: 새 형식의 publishable key(sb_publishable_...)는 JWT가 아니므로
  // 반드시 apikey 헤더로만 보냅니다. Authorization: Bearer 로 보내면
  // JWT 검증에 실패해 인증이 되지 않습니다. (Supabase 공식 문서 기준)
  return {
    "apikey": SUPABASE_ANON_KEY,
    "Content-Type": "application/json",
    "Prefer": "return=minimal",
  };
}

async function logScreenout(terminateId) {
  if (state.screenoutSent) return;
  state.screenoutSent = true;
  const age = state.answers.q1;
  const reason = terminateId === "terminate_app" ? "no_app"
    : (age === "19이하" ? "age_under20" : "age_over40");
  try {
    await fetch(SUPABASE_URL + "/rest/v1/survey_screenouts", {
      method: "POST",
      headers: supabaseHeaders(),
      body: JSON.stringify({ response_uuid: RESPONSE_UUID, reason: reason, age_bracket: age || null }),
    });
  } catch (e) { /* 집계용이라 실패해도 응답자 경험에는 영향 없음 */ }
}

async function submitUtApplicant() {
  if (state.utSubmitting || state.utSubmitted) return;
  state.utSubmitting = true;
  if (!UT_APPLICANT_UUID) UT_APPLICANT_UUID = newUuid();
  const u = state.ut;

  const payload = {
    applicant_uuid: UT_APPLICANT_UUID,
    name_or_nickname: (u.name || "").trim(),
    contact_method: u.method,
    contact_value: (u.contact || "").trim(),
    finnq_experience: u.finnq,
    consent_privacy: true,
  };

  try {
    const res = await fetch(SUPABASE_URL + "/rest/v1/ut_applicants", {
      method: "POST", headers: supabaseHeaders(), body: JSON.stringify(payload),
    });
    if (res.ok || res.status === 409) {
      state.utSubmitted = true;
      state.utSubmitting = false;
      goTo("ut_done");
      return;
    }
    throw new Error("ut submit failed: " + res.status + " " + (await res.text()));
  } catch (e) {
    console.error(e);
    state.utSubmitting = false;
    goTo("ut_error");
  }
}

async function submitAnswers() {
  if (state.submitting || state.submitted) return;
  state.submitting = true;
  const a = state.answers;

  const payload = {
    response_uuid: RESPONSE_UUID,
    q1_age: a.q1,
    q2_app: a.q2,
    q2_app_other: a.q2 === "기타" ? (a.q2_other || "").trim() : null,
    q3_frequency: a.q3,
    q4_purpose: a.q4,
    q4_purpose_other: a.q4 === "기타" ? (a.q4_other || "").trim() : null,
    q5_choice_1: (a.q5 || [])[0] || null,
    q5_choice_2: (a.q5 || [])[1] || null,
    q6_score: typeof a.q6 === "number" ? a.q6 : null,
    q6_na: a.q6 === "na",
    q7_choice: a.q7,
    q8_score: typeof a.q8 === "number" ? a.q8 : null,
    q8_na: a.q8 === "na",
    q9_choice: a.q9,
    q10_score: typeof a.q10 === "number" ? a.q10 : null,
    q10_na: a.q10 === "na",
    q11_choice: a.q11,
    q12_score: typeof a.q12 === "number" ? a.q12 : null,
    q12_no_card: a.q12 === "no_card",
    q12_not_checked_in_app: a.q12 === "not_checked",
    q13_choice: a.q13,
    q14_text: (a.q14 || "").trim() || null,
  };

  try {
    const res = await fetch(SUPABASE_URL + "/rest/v1/survey_responses", {
      method: "POST", headers: supabaseHeaders(), body: JSON.stringify(payload),
    });
    // 409 = 같은 응답번호가 이미 저장됨(재전송) → 성공으로 처리
    if (res.ok || res.status === 409) {
      state.submitted = true;
      state.submitting = false;
      goTo("ut_ask");
      return;
    }
    throw new Error("submit failed: " + res.status + " " + (await res.text()));
  } catch (e) {
    console.error(e);
    state.submitting = false;
    goTo("error");
  }
}

render();
</script>
</body>
</html>
